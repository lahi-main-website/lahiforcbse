<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CBSE Class 9 Timetable Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #020617; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    .hov:hover { background: #1e293b !important; }
    .pcell { transition: transform .15s, box-shadow .15s; cursor: default; }
    .pcell:hover { transform: scale(1.05); z-index: 2; position: relative; }
    .sglow { animation: sg 2.2s ease-in-out infinite; }
    @keyframes sg {
      0%, 100% { box-shadow: 0 0 7px 2px rgba(249,115,22,.35); }
      50%       { box-shadow: 0 0 14px 5px rgba(249,115,22,.65); }
    }
    .gbtn { transition: all .2s; }
    .gbtn:hover { transform: translateY(-1px); }
    input[type=color] { -webkit-appearance: none; }
    input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type=color]::-webkit-color-swatch { border: none; border-radius: 5px; }
    select option { background: #1e293b; color: #e2e8f0; }

    /* ── Print styles ── */
    @media print {
      body { background: #fff !important; color: #000 !important; }
      /* Hide everything except the timetable table and legend */
      body > div > div:first-child,   /* header */
      body > div > div:nth-child(2),  /* tab bar */
      body > div > div:last-child > div:first-child,  /* chips row */
      button { display: none !important; }
      table { border-collapse: collapse !important; width: 100% !important; font-size: 11px; }
      th, td { border: 1px solid #ccc !important; padding: 4px 6px !important; }
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      @page { size: A4 landscape; margin: 12mm; }
    }
  </style>

  <!-- html2canvas + jsPDF for PDF export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    // exportTimetablePDF — called from the React Export PDF button
    function exportTimetablePDF(subjects, config, timetable, subMap, annualHrs) {
      var el = document.querySelector('table');
      if (!el) {
        alert('Please generate a timetable first, then click Export PDF.');
        return;
      }

      // Capture the timetable table + legend
      var wrapper = document.querySelector('[style*="overflowX"]') || el.closest('div') || document.body;

      html2canvas(wrapper, {
        backgroundColor: '#020617',
        scale: 2,
        useCORS: true,
        logging: false
      }).then(function(canvas) {
        var imgData = canvas.toDataURL('image/png');
        var { jsPDF } = window.jspdf;
        var pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });

        var pageW  = pdf.internal.pageSize.getWidth();
        var pageH  = pdf.internal.pageSize.getHeight();
        var margin = 10;
        var imgW   = pageW - margin * 2;
        var imgH   = (canvas.height * imgW) / canvas.width;

        // Header
        pdf.setFontSize(14);
        pdf.setTextColor(249, 115, 22);
        pdf.text('CBSE Skill Education Timetable', margin, margin + 6);
        pdf.setFontSize(9);
        pdf.setTextColor(100, 116, 139);
        pdf.text('Generated by LAHI × CBSE Timetable Generator  |  ' + new Date().toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' }), margin, margin + 12);

        var startY = margin + 16;

        // If timetable fits in one page
        if (imgH <= pageH - startY - margin) {
          pdf.addImage(imgData, 'PNG', margin, startY, imgW, imgH);
        } else {
          // Multi-page: slice image
          var pageImgH = pageH - startY - margin;
          var totalPages = Math.ceil(imgH / pageImgH);
          for (var p = 0; p < totalPages; p++) {
            if (p > 0) { pdf.addPage(); startY = margin; }
            var srcY  = (p * pageImgH * canvas.width) / imgW;
            var sliceH = Math.min(pageImgH, imgH - p * pageImgH);
            pdf.addImage(imgData, 'PNG', margin, startY, imgW, sliceH, '', 'FAST', 0);
          }
        }

        // Footer
        pdf.setFontSize(8);
        pdf.setTextColor(100, 116, 139);
        pdf.text('Skill Education (Kaushal Vikas) allocated as double periods per CBSE NCrF-SE 2023  |  www.lendahandindia.org', margin, pageH - 5);

        pdf.save('LAHI_CBSE_Timetable_' + new Date().toISOString().slice(0,10) + '.pdf');
      }).catch(function(err) {
        console.error('PDF export error:', err);
        alert('PDF export failed. Please try Print → Save as PDF instead.');
      });
    }
  </script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // ── CBSE NCrF Class 9 defaults ──────────────────────────────────────────────
    const DEFAULT_SUBJECTS = [
      { id:"r1",    name:"Language R1 (English)",          periodsPerWeek:4, annualHrsTarget:120, color:"#3B82F6", isSkill:false },
      { id:"r2",    name:"Language R2 (Hindi)",             periodsPerWeek:4, annualHrsTarget:120, color:"#8B5CF6", isSkill:false },
      { id:"r3",    name:"Language R3 (Sanskrit)",          periodsPerWeek:4, annualHrsTarget:120, color:"#A855F7", isSkill:false },
      { id:"math",  name:"Mathematics",                     periodsPerWeek:5, annualHrsTarget:150, color:"#F59E0B", isSkill:false },
      { id:"sci",   name:"Science",                         periodsPerWeek:5, annualHrsTarget:150, color:"#10B981", isSkill:false },
      { id:"sst",   name:"Social Science",                  periodsPerWeek:5, annualHrsTarget:150, color:"#06B6D4", isSkill:false },
      { id:"skill", name:"Skill Education (Kaushal Vikas)", periodsPerWeek:4, annualHrsTarget:110, color:"#F97316", isSkill:true  },
      { id:"inter", name:"Interdisciplinary Areas",         periodsPerWeek:4, annualHrsTarget:120, color:"#14B8A6", isSkill:false },
      { id:"art",   name:"Art Education",                   periodsPerWeek:2, annualHrsTarget:60,  color:"#EC4899", isSkill:false },
      { id:"pe",    name:"PE & Well-being",                 periodsPerWeek:2, annualHrsTarget:60,  color:"#EF4444", isSkill:false },
    ];

    const DAYS       = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    const SHORT_DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat"];

    // ── Time helpers ────────────────────────────────────────────────────────────
    function timeAdd(base, mins) {
      const [h, m] = base.split(":").map(Number);
      const t = h * 60 + m + mins;
      return `${String(Math.floor(t / 60) % 24).padStart(2,"0")}:${String(t % 60).padStart(2,"0")}`;
    }
    function fmt(t) {
      const [h, m] = t.split(":").map(Number);
      return `${h % 12 || 12}:${String(m).padStart(2,"0")} ${h >= 12 ? "PM" : "AM"}`;
    }
    function buildSlots(periodsPerDay, periodDuration, breaks, schoolStart) {
      const bm = {};
      breaks.forEach(b => { bm[b.afterPeriod] = b.duration; });
      const slots = [];
      let cur = schoolStart;
      for (let i = 0; i < periodsPerDay; i++) {
        const end = timeAdd(cur, periodDuration);
        slots.push({ start: cur, end });
        cur = end;
        if (bm[i + 1]) cur = timeAdd(cur, bm[i + 1]);
      }
      return slots;
    }

    // ── Timetable generator ─────────────────────────────────────────────────────
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function generateTimetable(config, subjects) {
      const { periodsPerDay, periodDuration, breaks, schoolStart, workingDays } = config;
      const slots = buildSlots(periodsPerDay, periodDuration, breaks, schoolStart);
      const breakAfterSet = new Set(breaks.map(b => b.afterPeriod));
      const grid = Array.from({ length: workingDays }, () => Array(periodsPerDay).fill(null));

      // ── 1. Place skill subjects as double periods ──────────────────────────
      const skillSubs  = subjects.filter(s => s.isSkill);
      const pairTokens = [];
      skillSubs.forEach(s => {
        const pairs = Math.floor(s.periodsPerWeek / 2);
        for (let i = 0; i < pairs; i++) pairTokens.push(s.id);
      });

      function availablePairPositions() {
        const positions = [];
        for (let d = 0; d < workingDays; d++) {
          for (let p = 0; p < periodsPerDay - 1; p++) {
            if (!grid[d][p] && !grid[d][p + 1] && !breakAfterSet.has(p + 1)) {
              positions.push({ day: d, pos: p });
            }
          }
        }
        return shuffle(positions);
      }

      const shuffledPairs = shuffle(pairTokens);
      const pairPositions = availablePairPositions();
      shuffledPairs.forEach((subId, idx) => {
        if (idx >= pairPositions.length) return;
        const { day, pos } = pairPositions[idx];
        if (!grid[day][pos] && !grid[day][pos + 1]) {
          grid[day][pos]     = subId;
          grid[day][pos + 1] = subId;
        }
      });

      skillSubs.forEach(s => {
        if (s.periodsPerWeek % 2 === 1) {
          outer: for (let d = 0; d < workingDays; d++) {
            for (let p = 0; p < periodsPerDay; p++) {
              if (!grid[d][p]) { grid[d][p] = s.id; break outer; }
            }
          }
        }
      });

      // ── 2. Place normal subjects ───────────────────────────────────────────
      const normalSubs = subjects.filter(s => !s.isSkill);
      let pool = [];
      normalSubs.forEach(s => {
        for (let i = 0; i < s.periodsPerWeek; i++) pool.push(s.id);
      });
      pool = shuffle(pool);

      let pi = 0;
      for (let d = 0; d < workingDays; d++) {
        for (let p = 0; p < periodsPerDay; p++) {
          if (!grid[d][p]) {
            grid[d][p] = pool[pi] ?? null;
            pi++;
          }
        }
      }

      return { slots, grid, days: DAYS.slice(0, workingDays), breakAfterSet };
    }

    // ── Styles ──────────────────────────────────────────────────────────────────
    const IS = {
      background:"#0f172a", border:"1px solid #334155", borderRadius:8,
      color:"#e2e8f0", padding:"7px 10px", fontSize:13, width:"100%", boxSizing:"border-box"
    };
    const LS = {
      color:"#94a3b8", fontSize:11, fontFamily:"'Space Mono',monospace",
      letterSpacing:"0.06em", marginBottom:5, display:"block"
    };
    const SB = {
      background:"#1e293b", border:"1px solid #334155", borderRadius:8,
      color:"#e2e8f0", cursor:"pointer", fontSize:18, fontWeight:700,
      width:34, height:34, display:"flex", alignItems:"center", justifyContent:"center", padding:0
    };

    // ── Small components ────────────────────────────────────────────────────────
    function Panel({ title, subtitle, children }) {
      return (
        <div style={{ background:"#0f172a", border:"1px solid #1e293b", borderRadius:14, padding:18 }}>
          <div style={{ marginBottom:14 }}>
            <div style={{ fontFamily:"'Space Mono',monospace", fontSize:10, color:"#f97316", letterSpacing:"0.12em", marginBottom:3 }}>{title.toUpperCase()}</div>
            {subtitle && <div style={{ fontSize:11, color:"#475569" }}>{subtitle}</div>}
          </div>
          {children}
        </div>
      );
    }

    function CF({ label, children }) {
      return <div style={{ marginBottom:14 }}><label style={LS}>{label}</label>{children}</div>;
    }

    function Stepper({ value, min, max, step=1, onChange }) {
      return (
        <div style={{ display:"flex", alignItems:"center", gap:10 }}>
          <button onClick={() => onChange(Math.max(min, value - step))} style={{ ...SB, opacity:value<=min?0.3:1 }}>−</button>
          <span style={{ fontFamily:"'Space Mono',monospace", fontSize:18, fontWeight:700, color:"#f8fafc", minWidth:32, textAlign:"center" }}>{value}</span>
          <button onClick={() => onChange(Math.min(max, value + step))} style={{ ...SB, opacity:value>=max?0.3:1 }}>+</button>
        </div>
      );
    }

    function Chip({ icon, label, value }) {
      return (
        <div style={{ background:"#0f172a", border:"1px solid #1e293b", borderRadius:8, padding:"6px 12px", display:"flex", alignItems:"center", gap:7 }}>
          <span style={{ fontSize:13 }}>{icon}</span>
          <span style={{ fontSize:11, color:"#64748b" }}>{label}</span>
          <span style={{ fontFamily:"'Space Mono',monospace", fontSize:12, color:"#e2e8f0" }}>{value}</span>
        </div>
      );
    }

    function Stat({ label, value, accent }) {
      return (
        <div style={{ textAlign:"center" }}>
          <div style={{ fontFamily:"'Space Mono',monospace", fontSize:17, fontWeight:700, color:accent?"#f97316":"#f8fafc" }}>{value}</div>
          <div style={{ fontSize:10, color:"#64748b" }}>{label}</div>
        </div>
      );
    }

    // ── Subject row ─────────────────────────────────────────────────────────────
    function SubjectRow({ sub, onChange, onRemove }) {
      const [pwStr, setPwStr] = useState(String(sub.periodsPerWeek));

      const handlePwChange = (e) => {
        const raw = e.target.value;
        setPwStr(raw);
        const n = parseInt(raw, 10);
        if (!isNaN(n) && n >= 0 && n <= 30) onChange({ ...sub, periodsPerWeek: n });
      };

      const displayed = pwStr !== "" && parseInt(pwStr,10) === sub.periodsPerWeek
        ? pwStr
        : String(sub.periodsPerWeek);

      return (
        <div style={{ display:"grid", gridTemplateColumns:"1fr 84px 34px 28px", gap:6, alignItems:"center", marginBottom:6 }}>
          <input
            value={sub.name}
            onChange={e => onChange({ ...sub, name: e.target.value })}
            style={IS}
          />
          <input
            type="number"
            min={0} max={30}
            value={displayed}
            onChange={handlePwChange}
            style={{ ...IS, textAlign:"center" }}
          />
          <input
            type="color"
            value={sub.color}
            onChange={e => onChange({ ...sub, color: e.target.value })}
            style={{ width:34, height:34, border:"2px solid #334155", borderRadius:8, cursor:"pointer", background:"none", padding:2 }}
          />
          <button onClick={onRemove}
            style={{ background:"#ef44441a", border:"1px solid #ef4444", borderRadius:6, color:"#ef4444", cursor:"pointer", fontSize:13, padding:"4px 7px" }}>×</button>
        </div>
      );
    }

    // ── Breaks editor ───────────────────────────────────────────────────────────
    function BreaksEditor({ breaks, onChange, periodsPerDay }) {
      const addBreak = () => {
        const used = new Set(breaks.map(b => b.afterPeriod));
        let next = 1;
        while (used.has(next) && next < periodsPerDay) next++;
        if (used.has(next)) return;
        onChange([...breaks, { id: Date.now(), afterPeriod: next, duration: 20 }]);
      };
      const remove = id => onChange(breaks.filter(b => b.id !== id));
      const upd    = (id, field, val) => onChange(breaks.map(b => b.id === id ? { ...b, [field]: val } : b));

      return (
        <div>
          {breaks.length === 0 && <div style={{ fontSize:12, color:"#475569", marginBottom:8 }}>No breaks configured</div>}
          {breaks.map(b => (
            <div key={b.id} style={{ display:"grid", gridTemplateColumns:"1fr 1fr 28px", gap:6, marginBottom:8, alignItems:"end" }}>
              <div>
                <div style={{ ...LS, fontSize:10 }}>AFTER PERIOD</div>
                <select value={b.afterPeriod} onChange={e => upd(b.id,"afterPeriod",+e.target.value)}
                  style={{ ...IS, padding:"6px 8px" }}>
                  {Array.from({length:periodsPerDay-1},(_,i)=>i+1).map(n=>(
                    <option key={n} value={n}>Period {n}</option>
                  ))}
                </select>
              </div>
              <div>
                <div style={{ ...LS, fontSize:10 }}>DURATION (min)</div>
                <input type="number" min={5} max={60} step={5} value={b.duration}
                  onChange={e => upd(b.id,"duration",+e.target.value)}
                  style={{ ...IS, textAlign:"center" }} />
              </div>
              <button onClick={() => remove(b.id)}
                style={{ background:"#ef44441a", border:"1px solid #ef4444", borderRadius:6, color:"#ef4444", cursor:"pointer", fontSize:13, padding:"5px 7px", marginBottom:1 }}>×</button>
            </div>
          ))}
          <button onClick={addBreak}
            style={{ width:"100%", padding:"7px 0", background:"#1e293b", border:"1px dashed #334155", borderRadius:8, color:"#64748b", cursor:"pointer", fontSize:12, fontFamily:"'Space Grotesk',sans-serif" }}>
            + Add Break
          </button>
        </div>
      );
    }

    // ── Day timeline preview ────────────────────────────────────────────────────
    function DayTimeline({ periodsPerDay, periodDuration, breaks }) {
      const bm = {};
      breaks.forEach(b => { bm[b.afterPeriod] = b.duration; });
      const segs = [];
      for (let i = 0; i < periodsPerDay; i++) {
        segs.push({ type:"p", mins:periodDuration, label:`P${i+1}` });
        if (bm[i+1]) segs.push({ type:"b", mins:bm[i+1] });
      }
      return (
        <div style={{ display:"flex", height:22, borderRadius:6, overflow:"hidden", gap:1 }}>
          {segs.map((s,i)=>(
            <div key={i} style={{ flex:s.mins, background:s.type==="p"?"#334155":"#10b98133", display:"flex", alignItems:"center", justifyContent:"center" }}>
              <span style={{ fontSize:8, color:s.type==="p"?"#94a3b8":"#10b981", fontFamily:"'Space Mono',monospace" }}>
                {s.type==="p" ? s.label : "☕"}
              </span>
            </div>
          ))}
        </div>
      );
    }

    // ── Main App ────────────────────────────────────────────────────────────────
    function App() {
      const [subjects, setSubjects] = useState(DEFAULT_SUBJECTS);
      const [config, setConfig] = useState({
        periodsPerDay: 8,
        periodDuration: 45,
        breaks: [
          { id:1, afterPeriod:2, duration:15 },
          { id:2, afterPeriod:5, duration:30 },
        ],
        schoolStart: "08:00",
        workingDays: 5,
        weeksPerYear: 36,
      });
      const [timetable, setTimetable] = useState(null);
      const [tab, setTab] = useState("config");

      const subMap = Object.fromEntries(subjects.map(s=>[s.id,s]));
      const totalPeriods = subjects.reduce((a,s)=>a+s.periodsPerWeek,0);
      const totalSlots   = config.periodsPerDay * config.workingDays;
      const annualHrs    = pw => Math.round(pw * config.periodDuration * config.weeksPerYear / 60);

      const generate = () => {
        setTimetable(generateTimetable(config, subjects));
        setTab("timetable");
      };

      const addSubject = () => {
        const colors = ["#6366f1","#14b8a6","#f43f5e","#84cc16","#fb923c","#0ea5e9"];
        setSubjects(prev => [...prev, {
          id:`sub_${Date.now()}`, name:"New Subject", periodsPerWeek:2, annualHrsTarget:null,
          color:colors[prev.length % colors.length], isSkill:false
        }]);
      };

      const updateSub = updated =>
        setSubjects(prev => prev.map(x => x.id===updated.id ? { ...updated, isSkill:x.isSkill, annualHrsTarget:x.annualHrsTarget } : x));
      const removeSub = id =>
        setSubjects(prev => prev.filter(x => x.id!==id));

      const breakAfterSet = timetable?.breakAfterSet ?? new Set(config.breaks.map(b=>b.afterPeriod));

      return (
        <div style={{ fontFamily:"'Space Grotesk',sans-serif", minHeight:"100vh", background:"#020617", color:"#e2e8f0" }}>
          {/* Header */}
          <div style={{ background:"linear-gradient(135deg,#0f172a 0%,#1e1b4b 100%)", borderBottom:"1px solid #1e293b", padding:"14px 24px" }}>
            <div style={{ maxWidth:1160, margin:"0 auto", display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:12 }}>
              <div style={{ display:"flex", alignItems:"center", gap:16 }}>
                <div>
                  <div style={{ fontFamily:"'Space Mono',monospace", color:"#f97316", fontSize:10, letterSpacing:"0.15em", marginBottom:3 }}>CBSE CLASS 9 · NCrF 2024 · SKILL ED AS DOUBLE BLOCKS</div>
                  <h1 style={{ margin:0, fontSize:20, fontWeight:700, color:"#f8fafc", letterSpacing:"-0.02em" }}>Timetable Generator</h1>
                  <div style={{ color:"#64748b", fontSize:11, marginTop:2 }}>Multiple breaks · Annual hours · Skill periods always paired</div>
                </div>
              </div>
              <div style={{ display:"flex", gap:18, alignItems:"center" }}>
                <Stat label="Periods/Day" value={config.periodsPerDay} />
                <Stat label="Period" value={`${config.periodDuration}m`} />
                <Stat label="Weeks/Yr" value={config.weeksPerYear} />
                <Stat label="Days/Wk" value={config.workingDays} />
                <Stat label="Start" value={fmt(config.schoolStart)} accent />
              </div>
            </div>
          </div>

          {/* Tabs */}
          <div style={{ background:"#0f172a", borderBottom:"1px solid #1e293b" }}>
            <div style={{ maxWidth:1160, margin:"0 auto", display:"flex", padding:"0 24px" }}>
              {[["config","⚙  Configure"],["timetable","📅  Timetable"]].map(([t,l])=>(
                <button key={t} className="hov"
                  onClick={()=>setTab(t)}
                  style={{ background:tab===t?"#1e293b":"transparent", border:"none",
                    borderBottom:tab===t?"2px solid #f97316":"2px solid transparent",
                    color:tab===t?"#f8fafc":"#64748b", cursor:"pointer",
                    fontFamily:"'Space Grotesk',sans-serif", fontSize:13, fontWeight:500, padding:"11px 20px" }}>
                  {l}
                </button>
              ))}
            </div>
          </div>

          <div style={{ maxWidth:1160, margin:"0 auto", padding:"20px 24px" }}>

            {/* ══ CONFIG TAB ══ */}
            {tab === "config" && (
              <div style={{ display:"grid", gridTemplateColumns:"300px 1fr", gap:20 }}>

                {/* Left */}
                <div style={{ display:"flex", flexDirection:"column", gap:16 }}>
                  <Panel title="School Configuration">
                    <CF label="SCHOOL START TIME">
                      <input type="time" value={config.schoolStart}
                        onChange={e=>setConfig(c=>({...c,schoolStart:e.target.value}))} style={IS} />
                    </CF>
                    <CF label="PERIODS PER DAY">
                      <Stepper value={config.periodsPerDay} min={4} max={12}
                        onChange={v=>setConfig(c=>({...c,periodsPerDay:v}))} />
                    </CF>
                    <CF label="PERIOD DURATION (minutes)">
                      <Stepper value={config.periodDuration} min={30} max={90} step={5}
                        onChange={v=>setConfig(c=>({...c,periodDuration:v}))} />
                    </CF>
                    <CF label="WORKING DAYS PER WEEK">
                      <div style={{ display:"flex", gap:6 }}>
                        {[5,6].map(d=>(
                          <button key={d} onClick={()=>setConfig(c=>({...c,workingDays:d}))}
                            style={{ flex:1, padding:"8px 0", borderRadius:8, cursor:"pointer",
                              fontFamily:"'Space Mono',monospace", fontSize:13,
                              background:config.workingDays===d?"#f97316":"#1e293b",
                              color:config.workingDays===d?"#fff":"#94a3b8",
                              border:"1px solid "+(config.workingDays===d?"#f97316":"#334155"),
                              fontWeight:config.workingDays===d?700:400 }}>
                            {d} Days
                          </button>
                        ))}
                      </div>
                    </CF>
                    <CF label="TEACHING WEEKS PER YEAR">
                      <Stepper value={config.weeksPerYear} min={20} max={52}
                        onChange={v=>setConfig(c=>({...c,weeksPerYear:v}))} />
                      <div style={{ fontSize:11, color:"#475569", marginTop:5 }}>CBSE recommends ~36 teaching weeks</div>
                    </CF>
                  </Panel>

                  <Panel title="Breaks Configuration">
                    <BreaksEditor breaks={config.breaks} periodsPerDay={config.periodsPerDay}
                      onChange={b=>setConfig(c=>({...c,breaks:b}))} />
                    {config.breaks.length > 0 && (
                      <div style={{ marginTop:14 }}>
                        <div style={{ ...LS, marginBottom:6 }}>DAY TIMELINE PREVIEW</div>
                        <DayTimeline periodsPerDay={config.periodsPerDay}
                          periodDuration={config.periodDuration} breaks={config.breaks} />
                      </div>
                    )}
                  </Panel>

                  {/* Slot summary */}
                  <div style={{ background:"#0f172a", border:"1px solid #1e293b", borderRadius:12, padding:14 }}>
                    {[
                      ["Slots available / week", totalSlots, null],
                      ["Periods configured / week", totalPeriods,
                        totalPeriods>totalSlots?"#ef4444":totalPeriods===totalSlots?"#10b981":"#f59e0b"],
                      ["School day ends ~",
                        fmt(buildSlots(config.periodsPerDay,config.periodDuration,config.breaks,config.schoolStart).at(-1).end),
                        "#94a3b8"],
                    ].map(([lbl,val,col])=>(
                      <div key={lbl} style={{ display:"flex", justifyContent:"space-between", marginBottom:6 }}>
                        <span style={{ color:"#64748b", fontSize:12 }}>{lbl}</span>
                        <span style={{ fontFamily:"'Space Mono',monospace", fontSize:13, color:col||"#e2e8f0" }}>{val}</span>
                      </div>
                    ))}
                    {totalPeriods !== totalSlots && (
                      <div style={{ marginTop:6, fontSize:11, color:"#64748b", background:"#1e293b", borderRadius:6, padding:"6px 10px" }}>
                        {totalPeriods > totalSlots
                          ? `⚠ ${totalPeriods-totalSlots} extra — some dropped`
                          : `ℹ ${totalSlots-totalPeriods} free slots — left empty`}
                      </div>
                    )}
                  </div>
                </div>

                {/* Right */}
                <div>
                  <Panel title="Subject Hours Configuration"
                    subtitle="CBSE NCrF 2024 · 1200 hrs/year · ★ Skill Education placed as double periods">
                    <div style={{ display:"grid", gridTemplateColumns:"1fr 84px 34px 28px", gap:6, marginBottom:6 }}>
                      {["SUBJECT","PERIODS/WK","CLR",""].map(h=>(
                        <span key={h} style={{ ...LS, textAlign:h==="PERIODS/WK"?"center":undefined }}>{h}</span>
                      ))}
                    </div>
                    {subjects.map(s=>(
                      <div key={s.id} style={{ position:"relative" }}>
                        {s.isSkill && (
                          <div style={{ position:"absolute", left:-10, top:"50%", transform:"translateY(-50%)", width:3, height:"60%", background:"#f97316", borderRadius:2 }} />
                        )}
                        <SubjectRow sub={s} onChange={updateSub} onRemove={()=>removeSub(s.id)} />
                      </div>
                    ))}
                    <button onClick={addSubject}
                      style={{ width:"100%", marginTop:6, padding:"8px 0", background:"#1e293b", border:"1px dashed #334155", borderRadius:8, color:"#64748b", cursor:"pointer", fontSize:13, fontFamily:"'Space Grotesk',sans-serif" }}>
                      + Add Subject
                    </button>

                    {/* Distribution bar */}
                    <div style={{ marginTop:20 }}>
                      <div style={{ ...LS, marginBottom:7 }}>WEEKLY DISTRIBUTION</div>
                      <div style={{ display:"flex", height:12, borderRadius:6, overflow:"hidden", gap:1 }}>
                        {subjects.filter(s=>s.periodsPerWeek>0).map(s=>(
                          <div key={s.id} title={`${s.name}: ${s.periodsPerWeek}`}
                            style={{ flex:s.periodsPerWeek, background:s.color, opacity:0.8 }} />
                        ))}
                      </div>
                    </div>

                    {/* Annual hours grid */}
                    <div style={{ marginTop:18 }}>
                      <div style={{ ...LS, marginBottom:8 }}>ANNUAL HOURS — CALCULATED vs NCrF TARGET ({config.weeksPerYear} weeks)</div>
                      <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(185px,1fr))", gap:6 }}>
                        {subjects.map(s=>{
                          const calc = annualHrs(s.periodsPerWeek);
                          const target = s.annualHrsTarget;
                          const diff = target ? calc - target : null;
                          const matchColor = diff === null ? "#64748b" : Math.abs(diff) <= 10 ? "#10b981" : diff < 0 ? "#f59e0b" : "#ef4444";
                          return (
                            <div key={s.id} style={{ display:"flex", alignItems:"center", justifyContent:"space-between",
                              background:s.color+"12", border:`1px solid ${s.color}33`,
                              borderLeft:`3px solid ${s.color}`, borderRadius:8, padding:"7px 10px" }}>
                              <div>
                                <div style={{ fontSize:12, color:s.color, fontWeight:600 }}>{s.name}</div>
                                {s.isSkill && <div style={{ fontSize:9, color:"#f97316", fontFamily:"'Space Mono',monospace" }}>★ double blocks</div>}
                                {target && <div style={{ fontSize:9, color:"#475569", marginTop:2 }}>NCrF target: {target}h</div>}
                              </div>
                              <div style={{ textAlign:"right" }}>
                                <div style={{ fontFamily:"'Space Mono',monospace", fontSize:13, color:"#e2e8f0" }}>
                                  {calc}<span style={{ fontSize:10, color:"#64748b" }}> hrs</span>
                                </div>
                                <div style={{ fontSize:10, color:"#475569" }}>{s.periodsPerWeek}×/wk</div>
                                {diff !== null && (
                                  <div style={{ fontSize:9, color:matchColor, fontFamily:"'Space Mono',monospace", marginTop:1 }}>
                                    {Math.abs(diff) <= 10 ? "✓ on track" : diff < 0 ? `▼ ${Math.abs(diff)}h short` : `▲ ${diff}h over`}
                                  </div>
                                )}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                      {/* Total row */}
                      <div style={{ marginTop:8, display:"flex", justifyContent:"space-between", alignItems:"center",
                        background:"#1e293b", border:"1px solid #334155", borderRadius:8, padding:"8px 12px" }}>
                        <span style={{ fontSize:12, color:"#94a3b8", fontFamily:"'Space Mono',monospace" }}>TOTAL (calculated)</span>
                        <span style={{ fontFamily:"'Space Mono',monospace", fontSize:14, fontWeight:700,
                          color: Math.abs(subjects.reduce((a,s)=>a+annualHrs(s.periodsPerWeek),0) - 1200) <= 20 ? "#10b981" : "#f59e0b" }}>
                          {subjects.reduce((a,s)=>a+annualHrs(s.periodsPerWeek),0)} hrs
                          <span style={{ fontSize:10, color:"#475569", fontWeight:400 }}> / 1200 NCrF</span>
                        </span>
                      </div>
                    </div>
                  </Panel>
                </div>
              </div>
            )}

            {tab === "config" && (
              <div style={{ textAlign:"center", marginTop:22 }}>
                <button className="gbtn" onClick={generate}
                  style={{ background:"linear-gradient(135deg,#f97316 0%,#ea580c 100%)", border:"none", borderRadius:12,
                    color:"#fff", cursor:"pointer", fontSize:15, fontWeight:700,
                    fontFamily:"'Space Grotesk',sans-serif", padding:"14px 52px",
                    letterSpacing:"0.05em", boxShadow:"0 4px 16px rgba(249,115,22,.28)" }}>
                  GENERATE TIMETABLE →
                </button>
              </div>
            )}

            {/* ══ TIMETABLE TAB ══ */}
            {tab === "timetable" && timetable && (
              <div>
                <div style={{ display:"flex", gap:10, marginBottom:18, flexWrap:"wrap" }}>
                  <Chip icon="🕐" label="Start" value={fmt(config.schoolStart)} />
                  <Chip icon="🕔" label="End" value={fmt(timetable.slots.at(-1).end)} />
                  <Chip icon="⏱" label="Period" value={`${config.periodDuration} min`} />
                  <Chip icon="☕" label="Breaks" value={`${config.breaks.length} (${config.breaks.map(b=>`${b.duration}m`).join(", ")})`} />
                  <Chip icon="📅" label="Weeks/yr" value={config.weeksPerYear} />
                </div>

                <div style={{ overflowX:"auto" }}>
                  <table style={{ borderCollapse:"separate", borderSpacing:3 }}>
                    <thead>
                      <tr>
                        <th style={{ background:"#0f172a", border:"1px solid #1e293b", borderRadius:6, width:48 }} />
                        {timetable.slots.map((slot,i)=>[
                          <th key={`p${i}`} style={{ background:"#0f172a", padding:"8px 6px", textAlign:"center",
                            border:"1px solid #1e293b", borderRadius:6, verticalAlign:"top", minWidth:90 }}>
                            <div style={{ fontFamily:"'Space Mono',monospace", fontSize:9, color:"#f97316", marginBottom:2 }}>P{i+1}</div>
                            <div style={{ fontSize:10, color:"#94a3b8" }}>{fmt(slot.start)}</div>
                            <div style={{ fontSize:9, color:"#475569" }}>– {fmt(slot.end)}</div>
                          </th>,
                          breakAfterSet.has(i+1) && (
                            <th key={`bh${i}`} style={{ background:"#0a1628", padding:"8px 6px", textAlign:"center",
                              border:"1px solid #10b98133", borderRadius:6, verticalAlign:"top", width:52 }}>
                              <div style={{ fontFamily:"'Space Mono',monospace", fontSize:8, color:"#10b981" }}>BREAK</div>
                              <div style={{ fontSize:12, color:"#10b981", fontWeight:700 }}>
                                {config.breaks.find(b=>b.afterPeriod===i+1)?.duration}m
                              </div>
                            </th>
                          )
                        ])}
                      </tr>
                    </thead>
                    <tbody>
                      {timetable.days.map((day,di)=>(
                        <tr key={di}>
                          <td style={{ padding:2, fontFamily:"'Space Mono',monospace", fontSize:10, color:"#94a3b8",
                            textAlign:"right", paddingRight:10, whiteSpace:"nowrap", background:"#0f172a",
                            border:"1px solid #1e293b", borderRadius:6 }}>
                            {SHORT_DAYS[di].toUpperCase()}
                          </td>
                          {timetable.grid[di].map((subId,pi)=>{
                            const sub = subId ? subMap[subId] : null;
                            const isLeft  = sub?.isSkill && timetable.grid[di][pi+1]===subId;
                            const isRight = sub?.isSkill && timetable.grid[di][pi-1]===subId;
                            return [
                              <td key={`c${pi}`} style={{ padding:isLeft?`2px 0 2px 2px`:isRight?`2px 2px 2px 0`:`2px`, verticalAlign:"top" }}>
                                {sub ? (
                                  <div className={`pcell${sub.isSkill?" sglow":""}`}
                                    style={{
                                      background:sub.color+"22",
                                      border:`1.5px solid ${sub.color}${sub.isSkill?"bb":"44"}`,
                                      borderLeft: isRight?"none":`3px solid ${sub.color}`,
                                      borderRight: isLeft?"none":`1.5px solid ${sub.color}${sub.isSkill?"bb":"44"}`,
                                      borderRadius: isLeft?"8px 0 0 8px":isRight?"0 8px 8px 0":8,
                                      padding:"7px 5px", textAlign:"center", minHeight:60,
                                      display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center",
                                    }}>
                                    <div style={{ fontSize:11, fontWeight:600, color:sub.color, lineHeight:1.3 }}>
                                      {sub.name.split(" ").slice(0,2).join(" ")}
                                    </div>
                                    {sub.isSkill && isLeft && (
                                      <div style={{ fontSize:9, color:"#f97316", fontFamily:"'Space Mono',monospace", marginTop:3 }}>★ SKILL ×2</div>
                                    )}
                                  </div>
                                ) : (
                                  <div style={{ background:"#1e293b18", border:"1px dashed #1e293b", borderRadius:8, minHeight:60 }} />
                                )}
                              </td>,
                              breakAfterSet.has(pi+1) && (
                                <td key={`b${pi}`} style={{ padding:2, verticalAlign:"top", width:52 }}>
                                  <div style={{ background:"#10b98108", border:"1px solid #10b98133",
                                    borderRadius:8, minHeight:60, display:"flex", flexDirection:"column",
                                    alignItems:"center", justifyContent:"center" }}>
                                    <div style={{ fontSize:11, color:"#10b981" }}>☕</div>
                                    <div style={{ fontSize:9, color:"#10b98188", fontFamily:"'Space Mono',monospace", marginTop:2 }}>
                                      {config.breaks.find(b=>b.afterPeriod===pi+1)?.duration}m
                                    </div>
                                  </div>
                                </td>
                              )
                            ];
                          })}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>

                {/* Legend */}
                <div style={{ marginTop:22, background:"#0f172a", border:"1px solid #1e293b", borderRadius:12, padding:16 }}>
                  <div style={{ ...LS, marginBottom:10 }}>SUBJECT LEGEND · ANNUAL HOURS</div>
                  <div style={{ display:"flex", flexWrap:"wrap", gap:7 }}>
                    {subjects.map(s=>(
                      <div key={s.id} style={{ display:"flex", alignItems:"center", gap:8,
                        background:s.color+"15", border:`1px solid ${s.color}44`,
                        borderLeft:`3px solid ${s.color}`, borderRadius:8, padding:"5px 10px" }}>
                        <span style={{ fontSize:12, color:s.color, fontWeight:600 }}>{s.name}</span>
                        <span style={{ fontSize:11, color:"#64748b", fontFamily:"'Space Mono',monospace" }}>{annualHrs(s.periodsPerWeek)}h/yr{s.annualHrsTarget ? ` / ${s.annualHrsTarget}h` : ""}</span>
                        {s.isSkill && <span style={{ fontSize:10, color:"#f97316" }}>★×2</span>}
                      </div>
                    ))}
                  </div>
                  <div style={{ marginTop:12, padding:"9px 12px", background:"#f9731608",
                    border:"1px solid #f9731633", borderRadius:8, display:"flex", alignItems:"center", gap:10 }}>
                    <div style={{ width:10, height:10, borderRadius:"50%", background:"#f97316", flexShrink:0, boxShadow:"0 0 8px #f97316" }} />
                    <span style={{ fontSize:12, color:"#f97316" }}>
                      ★ <strong>Skill Education</strong> always placed as consecutive double periods — supports hands-on project work aligned with LAHI's Learning by Doing model &amp; CBSE NCrF 150 hrs/year allocation
                    </span>
                  </div>
                </div>

                <div style={{ textAlign:"center", marginTop:18, display:"flex", justifyContent:"center", gap:10, flexWrap:"wrap" }}>
                  <button className="gbtn" onClick={generate}
                    style={{ background:"#1e293b", border:"1px solid #334155", borderRadius:10, color:"#94a3b8",
                      cursor:"pointer", fontSize:13, fontFamily:"'Space Grotesk',sans-serif", padding:"9px 26px" }}>
                    ↺ Regenerate
                  </button>
                  <button className="gbtn" onClick={()=>setTab("config")}
                    style={{ background:"linear-gradient(135deg,#f97316 0%,#ea580c 100%)", border:"none",
                      borderRadius:10, color:"#fff", cursor:"pointer", fontSize:13, fontWeight:600,
                      fontFamily:"'Space Grotesk',sans-serif", padding:"9px 26px" }}>
                    ⚙ Edit Config
                  </button>
                  <button className="gbtn" onClick={() => window.print()}
                    style={{ background:"#1e293b", border:"1px solid #22c55e", borderRadius:10, color:"#22c55e",
                      cursor:"pointer", fontSize:13, fontWeight:600,
                      fontFamily:"'Space Grotesk',sans-serif", padding:"9px 26px" }}>
                    🖨 Print Timetable
                  </button>
                  <button className="gbtn" onClick={() => exportTimetablePDF(subjects, config, timetable, subMap, annualHrs)}
                    style={{ background:"linear-gradient(135deg,#6366f1 0%,#4f46e5 100%)", border:"none",
                      borderRadius:10, color:"#fff", cursor:"pointer", fontSize:13, fontWeight:600,
                      fontFamily:"'Space Grotesk',sans-serif", padding:"9px 26px" }}>
                    📄 Export PDF
                  </button>
                </div>
              </div>
            )}

            {tab === "timetable" && !timetable && (
              <div style={{ textAlign:"center", paddingTop:80, color:"#475569" }}>
                <div style={{ fontSize:48, marginBottom:16 }}>📅</div>
                <div style={{ fontSize:16, marginBottom:8 }}>No timetable generated yet</div>
                <button className="gbtn" onClick={generate}
                  style={{ background:"linear-gradient(135deg,#f97316 0%,#ea580c 100%)", border:"none",
                    borderRadius:10, color:"#fff", cursor:"pointer", fontSize:14, fontWeight:600,
                    fontFamily:"'Space Grotesk',sans-serif", padding:"12px 36px", marginTop:8 }}>
                  Generate Now →
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
